name: CI

on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deployments at the same time; let a running one finish.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  lint:
    name: Lint and type-check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Lint with ESLint
        run: npm run lint
      - name: Type-check with TypeScript
        run: npm run typecheck

  test:
    name: Run tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests with Vitest
        run: npm test

  build:
    name: Build Worker bundle
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build with vinext
        run: npm run build
      - name: Upload build output as artifact
        uses: actions/upload-artifact@v7
        with:
          name: worker-build
          path: .cloudflare/output
          # The build output lives in a dot-directory, which is skipped by default.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Workers
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Only needed for the cf CLI; the app itself comes from the build job.
      - name: Install dependencies
        run: npm ci
      - name: Download build output artifact
        uses: actions/download-artifact@v8
        with:
          name: worker-build
          path: .cloudflare/output
      - name: Upload Worker and Spotify secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          # The Spotify credentials are uploaded as Worker secrets together with
          # the code, so the first deployment already has them.
          umask 077
          printf 'SPOTIFY_CLIENT_ID=%s\nSPOTIFY_CLIENT_SECRET=%s\n' \
            "$SPOTIFY_CLIENT_ID" "$SPOTIFY_CLIENT_SECRET" > "$RUNNER_TEMP/worker-secrets.env"

          # Keep the address of the deployed app out of the log.
          set -o pipefail
          npx cf deploy --prebuilt --secrets-file "$RUNNER_TEMP/worker-secrets.env" 2>&1 \
            | sed -E 's#(https?://)?[A-Za-z0-9.-]+\.workers\.dev[^[:space:]]*#[deployment URL hidden]#g'
